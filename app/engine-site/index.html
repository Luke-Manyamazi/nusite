<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NuSite — Transform Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/nusite.css">
<style>
  /* Engine-specific styles only */

  /* Engine shell takes full viewport */
  .engine-shell{
    position:relative; z-index:1;
    min-height:100vh; display:flex; flex-direction:column;
  }

  /* Top status bar */
  .engine-bar{
    display:flex; align-items:center; gap:18px;
    padding:14px 28px; border-bottom:1px solid var(--border);
    background: rgba(10,10,15,0.7); backdrop-filter: blur(16px) saturate(140%);
    position:sticky; top:0; z-index:30;
  }
  html[data-theme="light"] .engine-bar{ background: rgba(250,250,255,0.7) }

  /* ─── Cinematic running stage ─── */
  .stage{
    position:relative;
    min-height: 64vh;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  /* Glow auras behind the orb */
  .stage::before, .stage::after{
    content:''; position:absolute; left:50%; top:50%;
    width:1200px; height:1200px; border-radius:50%;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(91,76,255,0.18) 0%, transparent 55%);
    pointer-events:none; animation: auraPulse 6s ease-in-out infinite;
  }
  .stage::after{
    width:800px; height:800px;
    background: radial-gradient(circle, rgba(200,255,0,0.10) 0%, transparent 60%);
    animation-delay: -3s;
  }
  @keyframes auraPulse{
    0%,100%{ opacity:0.7; transform:translate(-50%,-50%) scale(0.95) }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.05) }
  }

  /* The Orb */
  .orb{
    position:relative; width:220px; height:220px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), transparent 50%),
                radial-gradient(circle, var(--indigo) 0%, var(--indigo-dk) 70%, var(--void) 100%);
    box-shadow:
      0 0 60px var(--indigo-glow),
      0 0 120px rgba(91,76,255,0.4),
      inset 0 -20px 60px rgba(0,0,0,0.4),
      inset 0 20px 40px rgba(255,255,255,0.06);
    z-index:5;
  }
  .orb::before{
    /* spinning conic spark ring */
    content:''; position:absolute; inset:-12px; border-radius:50%;
    background: conic-gradient(from var(--ring,0deg), transparent 0deg, transparent 270deg, var(--lime) 320deg, transparent 360deg);
    -webkit-mask: radial-gradient(circle, transparent 49%, black 50%, black 53%, transparent 54%);
            mask: radial-gradient(circle, transparent 49%, black 50%, black 53%, transparent 54%);
    animation: spinRing 3s linear infinite;
    filter: blur(0.5px);
  }
  .orb::after{
    /* second counter-rotating ring */
    content:''; position:absolute; inset:-22px; border-radius:50%;
    background: conic-gradient(from var(--ring2,0deg), transparent 0deg, transparent 300deg, rgba(91,76,255,0.7) 340deg, transparent 360deg);
    -webkit-mask: radial-gradient(circle, transparent 49%, black 50%, black 51.5%, transparent 53%);
            mask: radial-gradient(circle, transparent 49%, black 50%, black 51.5%, transparent 53%);
    animation: spinRingRev 4.5s linear infinite;
  }
  @property --ring  { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @property --ring2 { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spinRing    { from{--ring:0deg}    to{--ring:360deg} }
  @keyframes spinRingRev { from{--ring2:360deg} to{--ring2:0deg} }

  /* File pills flying across the stage */
  .filefly{
    position:absolute; left:-12%; top:50%;
    transform: translate(0, -50%);
    padding:5px 11px 5px 9px; border-radius:100px;
    background: var(--slate-lt); border:1px solid var(--border-strong);
    display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:11px; color:var(--lavender); white-space:nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    animation: fileFly 6s linear infinite;
    z-index:6;
  }
  .filefly .dot{ width:6px; height:6px; border-radius:50%; background:var(--lavender-dk) }
  .filefly.done .dot{ background:var(--lime); box-shadow:0 0 8px var(--lime) }
  @keyframes fileFly{
    0%   { left:-12%; opacity:0; transform: translate(0,-50%) scale(0.85); color: var(--lavender) }
    8%   { opacity:1 }
    44%  { transform: translate(0, var(--ty, -50%)) scale(1); }
    48%  { transform: translate(0, var(--ty, -50%)) scale(0.6); opacity:0.4; filter: blur(3px); background: var(--indigo); border-color: var(--indigo-lt); color:#fff }
    52%  { transform: translate(0, var(--ty, -50%)) scale(0.6); opacity:0.4; filter: blur(3px); background: var(--lime); border-color: var(--lime); color: var(--void) }
    56%  { transform: translate(0, var(--ty2, -50%)) scale(1); opacity:1; filter:blur(0); background: var(--slate-lt); border-color: rgba(200,255,0,0.4); color: var(--lime) }
    92%  { opacity:1 }
    100% { left:112%; opacity:0; transform: translate(0, var(--ty2,-50%)) scale(0.85) }
  }

  /* Spark particles flying out of orb */
  .sparkout{
    position:absolute; left:50%; top:50%; width:4px; height:4px; border-radius:50%;
    background: var(--lime); box-shadow: 0 0 8px var(--lime), 0 0 16px rgba(200,255,0,0.5);
    animation: sparkBurst 2.4s ease-out infinite;
    pointer-events:none; z-index:7;
  }
  @keyframes sparkBurst{
    0%   { transform: translate(-50%,-50%) scale(0); opacity:0 }
    10%  { opacity:1 }
    100% { transform: translate(calc(-50% + var(--sx,0px)), calc(-50% + var(--sy,0px))) scale(0.6); opacity:0 }
  }

  /* Side preview windows during running */
  .preview-window{
    position:absolute; width:200px; height:140px;
    border-radius:10px; background: var(--slate); border:1px solid var(--border);
    box-shadow: var(--shadow-3);
    overflow:hidden; z-index:4;
    backdrop-filter: blur(8px);
  }
  .preview-window .pwhead{
    display:flex; align-items:center; gap:6px; padding:7px 10px;
    border-bottom:1px solid var(--border); font-family:var(--mono); font-size:9.5px; color:var(--lavender);
    letter-spacing:0.06em;
  }
  .preview-window.left{ left: 6%; top: 14%; transform: rotate(-3deg) }
  .preview-window.right{ right: 6%; bottom: 14%; transform: rotate(3deg) }

  /* Stage stepper at bottom */
  .stages{
    display:flex; gap:0; align-items:stretch;
    background: var(--slate); border-top: 1px solid var(--border);
  }
  .stages .step{
    flex:1; padding:14px 18px; border-right: 1px solid var(--border);
    display:flex; align-items:center; gap:12px;
    position:relative; transition: background .3s;
  }
  .stages .step:last-child{ border-right:none }
  .stages .step.done{ background: rgba(91,76,255,0.06) }
  .stages .step.active{ background: rgba(200,255,0,0.04) }
  .stages .step.active::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:2px;
    background: linear-gradient(90deg, var(--indigo), var(--lime));
    animation: stepBar 1.2s ease-in-out infinite;
  }
  @keyframes stepBar{
    0%,100%{ opacity:0.6 } 50%{ opacity:1 }
  }
  .stages .step .num{
    width:26px; height:26px; border-radius:50%;
    background: var(--slate-lt); border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:11px; color:var(--lavender); flex-shrink:0;
  }
  .stages .step.done .num{ background: var(--indigo); color:#fff; border-color:var(--indigo) }
  .stages .step.active .num{ background: var(--lime); color: var(--void); border-color: var(--lime); box-shadow:0 0 14px var(--lime) }

  /* Typewriter cursor */
  .tw-cursor{
    display:inline-block; width:7px; height:1.1em; vertical-align:-2px;
    background: var(--lime); margin-left:2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0 } }

  /* Done view — split with drag handle */
  .splitter{
    position:relative; width:100%; height:100%;
    overflow:hidden; border-radius:14px; isolation:isolate;
  }
  .splitter .pane{
    position:absolute; inset:0;
    background: var(--slate); overflow:hidden;
  }
  .splitter .pane.after{ clip-path: inset(0 0 0 var(--split, 50%)) }
  .splitter .handle{
    position:absolute; top:0; bottom:0; width:2px;
    background: linear-gradient(180deg, transparent, var(--lime) 20%, var(--lime) 80%, transparent);
    left: calc(var(--split, 50%));
    transform: translateX(-50%);
    cursor: ew-resize; z-index:5;
  }
  .splitter .handle::before{
    content:''; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    width:36px; height:36px; border-radius:50%;
    background: var(--void); border:2px solid var(--lime);
    box-shadow: 0 0 24px rgba(200,255,0,0.5), inset 0 0 8px rgba(200,255,0,0.15);
  }
  .splitter .handle::after{
    content:'‹›'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-family: var(--syne); font-weight: 800; font-size:14px; color: var(--lime);
    letter-spacing:-0.1em; pointer-events:none;
  }
  .splitter .label{
    position:absolute; top:14px; padding:5px 10px; border-radius:6px;
    font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    background: rgba(10,10,15,0.6); backdrop-filter:blur(8px); border:1px solid var(--border);
  }
  .splitter .label.before{ left:14px; color: var(--lavender) }
  .splitter .label.after{ right:14px; color: var(--lime) }

  /* Done — preview demos */
  .preview-before{
    padding:24px; height:100%;
    background: #eaeaea;
    font-family: 'Times New Roman', Times, serif; color:#222;
  }
  .preview-after{
    padding:30px; height:100%;
    background: linear-gradient(180deg, var(--void), #0e0e1f);
    color: var(--ghost); font-family: var(--dm);
  }

  /* Activity log */
  .log{
    font-family:var(--mono); font-size:11.5px; line-height:1.75; color:var(--lavender);
  }
  .log .row{ display:flex; gap:10px; padding:2px 0 }
  .log .row .t{ color:var(--lavender-dk); width:48px; flex-shrink:0 }
  .log .row.ok .body{ color:var(--ghost) }
  .log .row.ok .body b{ color:var(--lime); font-weight:600 }
  .log .row.warn .body{ color:var(--warning) }
  .log .row.err .body{ color:var(--error) }

  /* Spark wave for failed state */
  .crackle{
    position:relative;
    background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(255,76,76,0.06) 8px 9px);
  }
</style>
</head>
<body>
<div class="void-bg"></div>
<div class="dot-grid"></div>
<div id="app"></div>
